<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ആനവണ്ടി — aanavandi</title>
<meta name="description" content="aanavandi — a moody, cinematic KSRTC bus stand radio.">

<!--
  ============================================================
  ADDING YOUR LICENSED SONGS — fully automatic, no code edits
  ============================================================
  This player is self-hosted (no Spotify, no login, no ads, no
  30-second preview limit) AND it reads its song list live from
  your GitHub repo's "songs" folder every time the page loads,
  and again every few minutes after that. Add or remove an MP3
  in that folder on GitHub and the page picks it up on its own,
  nothing here needs to change.

  ONE-TIME SETUP (do this once, not per song):
  1) Fill in GITHUB_OWNER, GITHUB_REPO and GITHUB_BRANCH just
     below with your GitHub username, repo name, and branch
     (usually "main"). The repo needs to be public — this reads
     it through GitHub's public API, no login/token involved.
  2) Make sure there's a folder named "songs" (SONGS_FOLDER
     below) in that repo, and host this HTML file from the same
     repo, ideally via GitHub Pages.

  FROM THEN ON, adding a song is just: upload an MP3 into the
  songs folder on GitHub. Removing one is just: delete it there.
  The page always reflects whatever is in that folder.

  Display names: files named like "K J Yesudas - Aluva Puzha.mp3"
  (Artist - Title) show up nicely split into artist and title
  automatically. Anything without that " - " pattern just shows
  the file name as the title — still works, just plainer.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
  :root{
    --oxblood:#5a1a26;
    --oxblood-deep:#2a0c13;
    --brass:#caa056;
    --brass-dim:#7a5f2c;
    --brass-glow: rgba(202,160,86,0.55);
    --cream:#ecdfc4;
    --ink:#07070a;
    --teal-deep:#0a1a20;
    --teal:#12303a;
    --glass-panel: rgba(10,7,8,0.58);
    --vh: 100vh;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  body{
    position:relative; height:var(--vh); width:100vw;
    font-family:'Cormorant Garamond', serif;
    color:var(--cream);
  }
  @supports (height: 100dvh){ body{ height:100dvh; } }

  button{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- STAGE ---------- */
  #stage{ position:absolute; inset:0; overflow:hidden; }
  .scene-bg{
    position:absolute; inset:-4%;
    background: linear-gradient(to bottom, var(--teal-deep) 0%, var(--teal) 42%, #241708 74%, #150e05 100%);
    animation: kenburns 40s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes kenburns{ from{ transform:scale(1) translate(0,0);} to{ transform:scale(1.06) translate(-1%,-1%);} }

  .skyline{ position:absolute; left:0; right:0; bottom:40%; height:18%; display:flex; align-items:flex-end; opacity:.5; }
  .skyline i{ flex:none; background:#081014; margin-right:4px; }

  .lamp{ position:absolute; top:4%; width:2px; height:30%; background:linear-gradient(to bottom, rgba(255,210,130,0), #4a3210); }
  .lamp .glow{
    position:absolute; bottom:-38px; left:50%; width:200px; height:200px; margin-left:-100px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,205,120,.48), transparent 65%);
    animation: flicker 5s ease-in-out infinite;
  }
  .lamp.l1{ left:10%; } .lamp.l2{ left:52%; top:1%; } .lamp.l3{ left:86%; top:3%; }
  @keyframes flicker{ 0%,100%{opacity:1;} 46%{opacity:1;} 48%{opacity:.62;} 51%{opacity:1;} 83%{opacity:.82;} }

  .fog-band{ position:absolute; left:-10%; right:-10%; bottom:16%; height:14%; background: linear-gradient(to top, rgba(230,190,130,.16), transparent); filter: blur(6px); }
  .ground-reflect{ position:absolute; left:0; right:0; bottom:0; height:16%; background: linear-gradient(to bottom, rgba(20,10,8,.6), transparent); }

  /* ---------- ROADSIDE COCONUT PALMS ---------- */
  .palms{ position:absolute; left:0; right:0; bottom:12%; height:30%; pointer-events:none; }
  .palm{ position:absolute; bottom:0; width:5px; background:var(--oxblood-deep); transform-origin:bottom center; animation: sway 6s ease-in-out infinite; }
  .palm i{ position:absolute; width:26px; height:8px; background:#1c4a24; border-radius:50% 50% 50% 0; }
  .palm i:nth-child(1){ top:-4px; left:-1px; transform: rotate(-42deg) translateX(-10px); }
  .palm i:nth-child(2){ top:-5px; left:-1px; transform: rotate(-8deg) translateX(2px); }
  .palm i:nth-child(3){ top:-4px; left:-1px; transform: rotate(24deg) translateX(9px); }
  .palm i:nth-child(4){ top:-2px; left:-1px; transform: rotate(52deg) translateX(12px); }
  @keyframes sway{ 0%,100%{ transform: rotate(-2deg); } 50%{ transform: rotate(2deg); } }

  /* ---------- BUS ---------- */
  .bus-wrap{ position:absolute; left:50%; bottom:36%; width:min(72vw, 620px); transform:translateX(-50%); filter: drop-shadow(0 16px 20px rgba(0,0,0,.6)); z-index:3; }
  .bus-wrap svg{ display:block; width:100%; height:auto; }

  /* ---------- ROADSIDE KIOSKS ---------- */
  .kiosk{ position:absolute; bottom:15%; width:11%; min-width:74px; max-width:120px; z-index:2; }
  .kiosk .roof{ height:10px; border-radius:3px 3px 0 0; box-shadow:0 4px 8px rgba(0,0,0,.5); }
  .kiosk .body{ position:relative; height:64px; border-radius:0 0 5px 5px; overflow:hidden; }
  .kiosk .counter{ position:absolute; left:6%; right:6%; bottom:8%; height:34%; background:rgba(0,0,0,.55); border-radius:2px; }
  .kiosk .sign{
    position:absolute; top:-26px; left:50%; transform:translateX(-50%) rotate(-1.5deg);
    background:#0a0a0a; border:1px solid var(--brass-dim); border-radius:3px;
    padding:3px 7px; font-family:'Share Tech Mono', monospace; font-size:.5rem; letter-spacing:1px;
    color:var(--brass); white-space:nowrap;
  }
  .kiosk .bulb{ position:absolute; top:-4px; left:50%; width:60px; height:60px; margin-left:-30px; border-radius:50%; background:radial-gradient(circle, rgba(255,210,140,.4), transparent 70%); }

  .kiosk.lottery{ left:6%; }
  .kiosk.lottery .roof{ background: repeating-linear-gradient(90deg, #a1273a 0 8px, #ecdfc4 8px 16px); }
  .kiosk.lottery .body{ background: linear-gradient(160deg, #6b4a2c, #3a2a16); }
  .kiosk.lottery .ribbons{ position:absolute; top:8px; left:8%; right:8%; display:flex; justify-content:space-between; }
  .kiosk.lottery .ribbons span{
    display:block; width:6px; height:26px; border-radius:1px; transform-origin:top center;
    animation: ribbonSway 3.4s ease-in-out infinite;
  }
  .kiosk.lottery .ribbons span:nth-child(1){ background:#d9b23a; animation-delay:0s; }
  .kiosk.lottery .ribbons span:nth-child(2){ background:#a1273a; animation-delay:.4s; }
  .kiosk.lottery .ribbons span:nth-child(3){ background:#2e6b3a; animation-delay:.8s; }
  .kiosk.lottery .ribbons span:nth-child(4){ background:#c9762f; animation-delay:1.2s; }
  @keyframes ribbonSway{ 0%,100%{ transform: rotate(-6deg); } 50%{ transform: rotate(6deg); } }

  .kiosk.juice{ left:80%; }
  .kiosk.juice .roof{ background: repeating-linear-gradient(90deg, #2e6b3a 0 8px, #ecdfc4 8px 16px); }
  .kiosk.juice .body{ background: linear-gradient(160deg, #7a5522, #402c10); }
  .kiosk.juice .fruit{ position:absolute; bottom:44%; display:flex; gap:5px; left:10%; }
  .kiosk.juice .fruit i{ width:12px; height:12px; border-radius:50%; display:block; }
  .kiosk.juice .fruit i:nth-child(1){ background:radial-gradient(circle at 35% 35%, #ffb03a, #c9762f); }
  .kiosk.juice .fruit i:nth-child(2){ background:radial-gradient(circle at 35% 35%, #cfe86a, #7a9c2e); }
  .kiosk.juice .fruit i:nth-child(3){ background:radial-gradient(circle at 35% 35%, #ff7a6a, #b8352a); }

  .crowd{ position:absolute; bottom:15%; display:flex; align-items:flex-end; gap:14px; z-index:2; }
  .crowd i{ flex:none; width:9px; height:26px; border-radius:5px 5px 0 0; background:#060a0d; opacity:.85; box-shadow:0 4px 6px rgba(0,0,0,.4); }

  /* ---------- SHARED ATMOSPHERE OVERLAYS ---------- */
  #vignette{ position:absolute; inset:0; pointer-events:none; z-index:5; background: radial-gradient(ellipse 80% 75% at 50% 48%, transparent 40%, rgba(0,0,0,.62) 100%); }
  #grain{ position:absolute; inset:0; pointer-events:none; z-index:6; opacity:.16; mix-blend-mode:overlay; background-repeat:repeat; }
  .letterbox{ position:absolute; left:0; right:0; height:clamp(6px,2vh,16px); background:#000; z-index:8; pointer-events:none; }
  .letterbox.top{ top:0; } .letterbox.bottom{ bottom:0; }
  .particles{ position:absolute; inset:0; overflow:hidden; z-index:4; pointer-events:none; }
  .particles span{ position:absolute; bottom:-6%; width:3px; height:3px; border-radius:50%; background: rgba(255,220,160,.55); opacity:0; animation: floatUp linear infinite; }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(0) translateX(0); } 10%{opacity:.7;} 90%{opacity:.5;} 100%{ opacity:0; transform:translateY(-120vh) translateX(20px); } }

  /* ---------- TOP BAR ---------- */
  #top-bar{ position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 0; }
  #title-block{ text-align:center; margin:0 auto; pointer-events:none; }
  #title-ml{ font-family:'Noto Sans Malayalam', sans-serif; font-weight:700; font-size:clamp(1.5rem,5.2vw,2.5rem); margin:0;
    color:var(--brass); text-shadow: 0 0 22px var(--brass-glow), 0 2px 0 rgba(0,0,0,.5); letter-spacing:1px; }
  #title-en{ font-family:'Share Tech Mono', monospace; font-size:clamp(.55rem,1.4vw,.68rem); letter-spacing:4px; opacity:.55; margin:2px 0 0; }

  #ambience-btn{
    position:absolute; right:16px; top:max(14px, env(safe-area-inset-top));
    background:var(--glass-panel); border:1px solid rgba(202,160,86,.18); color:var(--cream);
    padding:9px 12px; border-radius:12px; font-weight:600; font-size:clamp(.68rem,1.6vw,.8rem);
    cursor:pointer; backdrop-filter: blur(8px); letter-spacing:.4px; z-index:21;
  }
  #ambience-btn.on{ color:var(--brass); border-color:rgba(202,160,86,.5); background:rgba(202,160,86,.14); }

  #active-badge{
    position:absolute; left:16px; top:max(14px, env(safe-area-inset-top));
    background:var(--glass-panel); border:1px solid rgba(202,160,86,.18); color:var(--cream);
    padding:9px 12px; border-radius:12px; font-weight:600; font-size:clamp(.65rem,1.5vw,.78rem);
    backdrop-filter: blur(8px); letter-spacing:.3px; z-index:21;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  #active-badge .dot{ width:7px; height:7px; border-radius:50%; background:#3ddc74; box-shadow:0 0 6px #3ddc74; flex:none; animation: dotPulse 2s ease-in-out infinite; }
  @keyframes dotPulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* ---------- PLAYER ---------- */
  #dashboard{
    position:absolute; bottom:max(18px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    z-index:30; width:min(92vw, 380px);
    background: linear-gradient(180deg, rgba(20,10,10,.78) 0%, rgba(8,4,4,.88) 100%);
    border:1px solid rgba(202,160,86,.22); border-radius:22px;
    padding:12px; backdrop-filter: blur(10px);
    box-shadow: 0 16px 40px rgba(0,0,0,.55);
    display:flex; flex-direction:column; gap:10px;
  }
  #np-panel{
    border-radius:12px; overflow:hidden; background:rgba(0,0,0,.35); min-height:76px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:14px 12px; gap:2px;
  }
  #np-index{ font-family:'Share Tech Mono', monospace; font-size:.62rem; letter-spacing:2px; color:var(--brass); opacity:.75; }
  #np-title{ font-size:clamp(1.05rem,3vw,1.3rem); font-weight:600; color:var(--cream); line-height:1.2; }
  #np-artist{ font-family:'Share Tech Mono', monospace; font-size:.68rem; letter-spacing:1px; opacity:.6; }

  #controls-row{ display:flex; align-items:center; justify-content:center; gap:clamp(8px,2vw,16px); flex-wrap:wrap; }
  .ctrl-btn{
    background: radial-gradient(circle at 35% 30%, #2a2320, #0e0b0a);
    border:1px solid rgba(202,160,86,.3); color:var(--cream); cursor:pointer;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, box-shadow .2s; flex:none;
    box-shadow: 0 3px 0 rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.06);
  }
  .ctrl-btn:hover{ box-shadow: 0 3px 0 rgba(0,0,0,.5), 0 0 14px var(--brass-glow); }
  .ctrl-btn:active{ transform: translateY(2px); }
  #prev-btn, #next-btn{ width:42px; height:42px; font-size:1rem; }
  #play-btn{ width:54px; height:54px; font-size:1.2rem; background: radial-gradient(circle at 35% 30%, var(--brass), var(--brass-dim)); color:#20140a; border:none; }

  #meta-row{ display:flex; align-items:center; gap:8px; padding:0 4px; }
  #time-elapsed, #time-duration{ font-family:'Share Tech Mono', monospace; font-size:.66rem; opacity:.65; flex:none; min-width:32px; text-align:center; user-select:none; }
  #progress-track{ flex:1; height:20px; display:flex; align-items:center; cursor:pointer; touch-action:none; }
  #progress-groove{ position:relative; width:100%; height:3px; border-radius:2px; background:rgba(255,255,255,.14); overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background:var(--brass); transition:width .2s linear; }
  #progress-knob{ position:absolute; top:50%; left:0%; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:var(--brass); box-shadow:0 0 6px var(--brass-glow); pointer-events:none; }
  #eq{ display:flex; align-items:flex-end; gap:3px; height:16px; flex:none; }
  #eq span{ width:3px; background:var(--brass); border-radius:2px; height:3px; opacity:.6; }
  body.playing #eq span:nth-child(1){ animation: eqbar .9s ease-in-out infinite; }
  body.playing #eq span:nth-child(2){ animation: eqbar .7s ease-in-out infinite .15s; }
  body.playing #eq span:nth-child(3){ animation: eqbar 1.1s ease-in-out infinite .3s; }
  body.playing #eq span:nth-child(4){ animation: eqbar .8s ease-in-out infinite .1s; }
  body.playing #eq span{ opacity:1; }
  @keyframes eqbar{ 0%,100%{height:3px;} 50%{height:16px;} }

  #hint{ position:absolute; bottom:max(6px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    font-size:.62rem; opacity:.4; letter-spacing:1px; z-index:5; font-family:'Share Tech Mono', monospace; display:none; }

  /* ---------- RESPONSIVE ---------- */
  @media (min-width:900px){
    #hint{ display:block; bottom:8px; }
    #dashboard{ bottom:26px; }
  }
  @media (max-width:640px){
    .bus-wrap{ width:min(90vw, 620px); bottom:44%; }
    .kiosk{ width:16%; }
    .kiosk.lottery{ left:2%; } .kiosk.juice{ left:78%; }
    #dashboard{ width:min(94vw, 380px); padding:10px; }
    #np-panel{ min-height:66px; padding:10px; }
    .letterbox{ height:0; }
    #ambience-btn .label, #active-badge .label{ display:none; }
    #ambience-btn, #active-badge{ padding:9px 10px; }
  }
  @media (max-height:520px){
    #top-bar{ padding-top:6px; }
    #title-ml{ font-size:1.1rem; }
    #title-en{ display:none; }
    #dashboard{ bottom:6px; gap:6px; padding:8px; }
    #np-panel{ min-height:44px; padding:6px; }
    #np-title{ font-size:.95rem; }
    #np-artist, #np-index{ display:none; }
    .kiosk{ display:none; }
    .bus-wrap{ bottom:54%; width:min(40vw,240px); }
    .skyline{ bottom:44%; }
  }
</style>
</head>
<body>

  <div id="stage">
    <div class="scene-bg"></div>
    <div class="skyline" id="skyline"></div>
    <div class="lamp l1"><div class="glow"></div></div>
    <div class="lamp l2"><div class="glow"></div></div>
    <div class="lamp l3"><div class="glow"></div></div>
    <div class="fog-band"></div>

    <div class="palms" id="palms"></div>

    <div class="kiosk lottery">
      <div class="bulb"></div>
      <div class="sign">KERALA LOTTERY</div>
      <div class="roof"></div>
      <div class="body"><div class="ribbons"><span></span><span></span><span></span><span></span></div><div class="counter"></div></div>
    </div>

    <div class="kiosk juice">
      <div class="bulb"></div>
      <div class="sign">FRESH JUICE</div>
      <div class="roof"></div>
      <div class="body"><div class="fruit"><i></i><i></i><i></i></div><div class="counter"></div></div>
    </div>

    <svg class="bus-wrap" viewBox="0 0 440 190" preserveAspectRatio="xMidYMax meet">
      <defs>
        <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7a2436"/>
          <stop offset="1" stop-color="#33101a"/>
        </linearGradient>
        <linearGradient id="busGlass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cfe6e8"/>
          <stop offset="1" stop-color="#6f9698"/>
        </linearGradient>
        <pattern id="windowsPattern" width="42" height="34" patternUnits="userSpaceOnUse">
          <rect width="34" height="34" rx="4" fill="url(#busGlass)"/>
        </pattern>
        <radialGradient id="headlightGlow" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#fff2c4" stop-opacity="0.85"/>
          <stop offset="1" stop-color="#fff2c4" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <ellipse cx="220" cy="182" rx="200" ry="9" fill="rgba(0,0,0,0.5)"/>
      <ellipse cx="55" cy="176" rx="72" ry="18" fill="url(#headlightGlow)"/>
      <rect x="20" y="55" width="400" height="92" rx="10" fill="url(#busBody)" stroke="#180508" stroke-width="2"/>
      <rect x="20" y="50" width="400" height="9" rx="4" fill="#3d1420"/>
      <rect x="34" y="66" width="360" height="34" fill="url(#windowsPattern)"/>
      <rect x="4" y="70" width="20" height="46" rx="6" fill="url(#busGlass)"/>
      <rect x="20" y="112" width="400" height="11" fill="#e3d0a3"/>
      <rect x="28" y="38" width="150" height="13" rx="2" fill="#050505" stroke="#7a5f2c" stroke-width="1"/>
      <text x="103" y="47.5" font-family="'Share Tech Mono',monospace" font-size="8" fill="#caa056" text-anchor="middle" letter-spacing="1">THIRUVANANTHAPURAM</text>
      <circle cx="15" cy="124" r="6" fill="#fff2c4"/>
      <circle cx="408" cy="124" r="5" fill="#c0392b"/>
      <rect x="10" y="136" width="410" height="7" rx="3" fill="#221414"/>
      <rect x="1" y="58" width="4" height="13" fill="#0c0c0c"/>
      <circle cx="3" cy="56" r="5" fill="#2a2a2a"/>
      <circle cx="86" cy="146" r="23" fill="#0b0b0b"/><circle cx="86" cy="146" r="9" fill="#3a3a3a"/>
      <circle cx="332" cy="146" r="23" fill="#0b0b0b"/><circle cx="332" cy="146" r="9" fill="#3a3a3a"/>
    </svg>

    <div class="crowd" style="left:34%;"><i></i><i style="height:30px"></i><i></i><i style="height:22px"></i></div>
    <div class="crowd" style="left:60%;"><i style="height:28px"></i><i></i><i style="height:24px"></i></div>

    <div class="ground-reflect"></div>
    <div class="particles"></div>
  </div>

  <div id="vignette"></div>
  <div id="grain"></div>
  <div class="letterbox top"></div>
  <div class="letterbox bottom"></div>

  <div id="top-bar">
    <div style="width:42px;"></div>
    <div id="title-block">
      <p id="title-ml">ആനവണ്ടി</p>
      <p id="title-en">A A N A V A N D I</p>
    </div>
    <div style="width:42px;"></div>
  </div>
  <button id="ambience-btn">◐ <span class="label">Ambience</span></button>
  <div id="active-badge"><span class="dot"></span><span id="active-count">—</span>&nbsp;<span class="label">riding along</span></div>

  <div id="dashboard">
    <div id="np-panel">
      <div id="np-index"></div>
      <div id="np-title">Loading songs…</div>
      <div id="np-artist"></div>
    </div>
    <div id="meta-row">
      <span id="time-elapsed">0:00</span>
      <div id="progress-track"><div id="progress-groove"><div id="progress-fill"></div><div id="progress-knob"></div></div></div>
      <span id="time-duration">0:00</span>
    </div>
    <div id="controls-row">
      <button id="prev-btn" class="ctrl-btn" title="Previous">⏮</button>
      <button id="play-btn" class="ctrl-btn" title="Play / Pause">▶</button>
      <button id="next-btn" class="ctrl-btn" title="Next">⏭</button>
      <div id="eq"><span></span><span></span><span></span><span></span></div>
    </div>
  </div>

  <audio id="player" preload="metadata"></audio>

  <p id="hint">tap play · aanavandi</p>

<script>
(function(){
  "use strict";

  /* ============ CONFIG — fill these in once ============ */
  var GITHUB_OWNER  = "sachinnair-dev";
  var GITHUB_REPO   = "aanavandi";
  var GITHUB_BRANCH = "main";
  var SONGS_FOLDER  = "songs";
  var REFRESH_EVERY_MS = 5 * 60 * 1000; // re-check the folder every 5 minutes

  var body = document.body;
  var player = document.getElementById('player');
  var TRACKS = [];
  var currentIndex = 0;

  function setNowPlayingMessage(title, artist){
    document.getElementById('np-index').textContent = '';
    document.getElementById('np-title').textContent = title;
    document.getElementById('np-artist').textContent = artist || '';
  }

  // "Artist - Title.mp3" (or "01 - Artist - Title.mp3") splits nicely into
  // artist + title. Anything else just shows the file name as the title.
  function parseTrackFromFile(item){
    var base = item.name.replace(/\.(mp3|m4a|ogg|wav)$/i, '');
    base = base.replace(/^\s*\d+[\s\-_.]*/, ''); // drop a leading "01 - " track number if present
    var parts = base.split(/\s-\s/);
    var artist = '', title = base;
    if (parts.length >= 2){ artist = parts[0].trim(); title = parts.slice(1).join(' - ').trim(); }
    return { title: title || item.name, artist: artist, file: item.download_url, _name: item.name };
  }

  function applyNewTrackList(newTracks){
    var playingName = TRACKS[currentIndex] ? TRACKS[currentIndex]._name : null;
    var firstLoad = (TRACKS.length === 0 && !player.src);
    TRACKS = newTracks;
    if (TRACKS.length === 0){ setNowPlayingMessage('No songs yet', 'drop MP3 files into the songs folder on GitHub'); return; }
    var matchIdx = playingName ? TRACKS.findIndex(function(t){ return t._name === playingName; }) : -1;
    if (matchIdx >= 0){
      currentIndex = matchIdx;
      document.getElementById('np-index').textContent = 'TRACK ' + (currentIndex+1) + ' OF ' + TRACKS.length;
    } else {
      loadTrack(0, false);
    }
    if (firstLoad) loadTrack(0, false);
  }

  function fetchTrackList(showLoading){
    if (showLoading) setNowPlayingMessage('Loading songs…', '');
    var api = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + SONGS_FOLDER + '?ref=' + GITHUB_BRANCH;
    fetch(api, { cache: 'no-store' })
      .then(function(res){ if (!res.ok) throw new Error('GitHub API responded ' + res.status); return res.json(); })
      .then(function(data){
        var files = data.filter(function(item){ return item.type === 'file' && /\.(mp3|m4a|ogg|wav)$/i.test(item.name); });
        files.sort(function(a,b){ return a.name.localeCompare(b.name, undefined, { numeric:true }); });
        applyNewTrackList(files.map(parseTrackFromFile));
      })
      .catch(function(err){
        console.warn('Could not load the song list from GitHub:', err);
        if (TRACKS.length === 0){ setNowPlayingMessage("Couldn't load the song list", 'check GITHUB_OWNER / GITHUB_REPO at the top of the script'); }
      });
  }

  /* ============ FIX MOBILE VIEWPORT HEIGHT (address bar resize) ============ */
  function setVh(){ document.documentElement.style.setProperty('--vh', window.innerHeight + 'px'); }
  setVh(); window.addEventListener('resize', setVh); window.addEventListener('orientationchange', setVh);

  /* ============ SKYLINE (generated) ============ */
  var skyline = document.getElementById('skyline');
  for (var s=0; s<22; s++){
    var b = document.createElement('i');
    var w = 18 + Math.random()*26;
    var h = 20 + Math.random()*75;
    b.style.width = w + 'px'; b.style.height = h + '%';
    skyline.appendChild(b);
  }

  /* ============ COCONUT PALMS (generated, scattered roadside) ============ */
  var palmHost = document.getElementById('palms');
  var palmSpots = [3,9,17,24,68,76,84,92];
  palmSpots.forEach(function(pct, idx){
    var p = document.createElement('div');
    p.className = 'palm';
    var h = 70 + Math.random()*40;
    p.style.left = pct + '%';
    p.style.height = h + 'px';
    p.style.animationDelay = (idx*0.4) + 's';
    p.innerHTML = '<i></i><i></i><i></i><i></i>';
    palmHost.appendChild(p);
  });

  /* ============ PARTICLES ============ */
  document.querySelectorAll('.particles').forEach(function(container){
    var count = 18;
    for (var p=0; p<count; p++){
      var sp = document.createElement('span');
      sp.style.left = (Math.random()*100)+'%';
      var dur = 7 + Math.random()*11;
      sp.style.animationDuration = dur+'s';
      sp.style.animationDelay = (Math.random()*dur)+'s';
      sp.style.opacity = (0.2 + Math.random()*0.4);
      container.appendChild(sp);
    }
  });

  /* ============ SELF-HOSTED PLAYBACK (plain <audio>, full songs, no login, no ads) ============ */
  var isScrubbing = false;

  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function loadTrack(index, autoplay){
    if (TRACKS.length === 0) return;
    currentIndex = ((index % TRACKS.length) + TRACKS.length) % TRACKS.length;
    var t = TRACKS[currentIndex];
    player.src = t.file;
    document.getElementById('np-index').textContent = 'TRACK ' + (currentIndex+1) + ' OF ' + TRACKS.length;
    document.getElementById('np-title').textContent = t.title;
    document.getElementById('np-artist').textContent = t.artist;
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('progress-knob').style.left = '0%';
    document.getElementById('time-elapsed').textContent = '0:00';
    document.getElementById('time-duration').textContent = '0:00';
    if (autoplay){ player.play().catch(function(){ /* needs a user gesture first — fine, they just tapped play */ }); }
  }

  function playPause(){
    if (TRACKS.length === 0) return;
    if (player.paused){ player.play().catch(function(err){ console.warn('Could not play — check that', TRACKS[currentIndex].file, 'is reachable.', err); }); }
    else { player.pause(); }
  }
  function nextTrack(){ if (TRACKS.length === 0) return; var wasPlaying = !player.paused; loadTrack(currentIndex+1, wasPlaying); }
  function prevTrack(){ if (TRACKS.length === 0) return; var wasPlaying = !player.paused; loadTrack(currentIndex-1, wasPlaying); }

  player.addEventListener('play', function(){ body.classList.add('playing'); document.getElementById('play-btn').textContent = '⏸'; });
  player.addEventListener('pause', function(){ body.classList.remove('playing'); document.getElementById('play-btn').textContent = '▶'; });
  player.addEventListener('ended', function(){ nextTrack(); });
  player.addEventListener('error', function(){
    if (TRACKS.length === 0) return;
    document.getElementById('np-title').textContent = TRACKS[currentIndex].title + ' — file not reachable';
    document.getElementById('np-artist').textContent = 'check the songs folder on GitHub';
  });
  player.addEventListener('timeupdate', function(){
    if (isScrubbing || !player.duration) return;
    var pct = Math.min(100, (player.currentTime / player.duration) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-knob').style.left = pct + '%';
    document.getElementById('time-elapsed').textContent = fmtTime(player.currentTime);
    document.getElementById('time-duration').textContent = fmtTime(player.duration);
  });
  player.addEventListener('loadedmetadata', function(){
    document.getElementById('time-duration').textContent = fmtTime(player.duration);
  });

  /* ============ pick up the folder now, and keep checking ============ */
  setNowPlayingMessage('Loading songs…', '');
  fetchTrackList(true);
  setInterval(function(){ fetchTrackList(false); }, REFRESH_EVERY_MS);

  /* ============ SEEK (drag or tap the progress bar) ============ */
  (function setupSeek(){
    var track = document.getElementById('progress-track');
    var fill = document.getElementById('progress-fill');
    var knob = document.getElementById('progress-knob');
    var elapsedLabel = document.getElementById('time-elapsed');

    function pctFromEvent(e){
      var rect = track.getBoundingClientRect();
      var x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX));
      return Math.min(1, Math.max(0, (x - rect.left) / rect.width));
    }
    function preview(pct){
      fill.style.width = (pct*100) + '%';
      knob.style.left = (pct*100) + '%';
      if (player.duration) elapsedLabel.textContent = fmtTime(pct * player.duration);
    }
    track.addEventListener('pointerdown', function(e){
      if (!player.duration) return;
      isScrubbing = true;
      track.setPointerCapture(e.pointerId);
      preview(pctFromEvent(e));
    });
    track.addEventListener('pointermove', function(e){
      if (!isScrubbing) return;
      preview(pctFromEvent(e));
    });
    track.addEventListener('pointerup', function(e){
      if (!isScrubbing) return;
      var pct = pctFromEvent(e);
      preview(pct);
      isScrubbing = false;
      if (player.duration) player.currentTime = pct * player.duration;
    });
    track.addEventListener('pointercancel', function(){ isScrubbing = false; });
  })();

  document.getElementById('play-btn').addEventListener('click', playPause);
  document.getElementById('next-btn').addEventListener('click', nextTrack);
  document.getElementById('prev-btn').addEventListener('click', prevTrack);

  /* ============ AMBIENT SOUND (Web Audio API, synthesized, no external files) ============ */
  var audioCtx = null;
  var ambienceOn = false;
  var activeNodes = [];

  function ensureCtx(){ if (!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } return audioCtx; }
  function stopAmbience(){ activeNodes.forEach(function(n){ try{ n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }); activeNodes = []; }

  function engineIdle(ctx, dest){
    var osc = ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value = 42;
    var gain = ctx.createGain(); gain.gain.value = 0.03;
    var lfo = ctx.createOscillator(); lfo.frequency.value = 3.2; var lfoGain = ctx.createGain(); lfoGain.gain.value = 4;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    osc.connect(gain); gain.connect(dest);
    osc.start(); lfo.start();
    activeNodes.push(osc, lfo);
  }
  function crowdMurmur(ctx, dest){
    var bufferSize = 2 * ctx.sampleRate;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * 0.5; }
    var noise = ctx.createBufferSource(); noise.buffer = buffer; noise.loop = true;
    var filter = ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value = 850;
    var gain = ctx.createGain(); gain.gain.value = 0.04;
    noise.connect(filter); filter.connect(gain); gain.connect(dest);
    noise.start();
    activeNodes.push(noise);
  }
  function hornBeep(ctx, dest){
    var osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value = 340;
    var gain = ctx.createGain(); gain.gain.value = 0.0001;
    osc.connect(gain); gain.connect(dest);
    var t = ctx.currentTime;
    gain.gain.exponentialRampToValueAtTime(0.05, t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
    osc.start(t); osc.stop(t+0.4);
  }

  var hornTimer = null;
  function startAmbience(){
    if (!audioCtx) return;
    stopAmbience();
    var dest = audioCtx.destination;
    engineIdle(audioCtx, dest);
    crowdMurmur(audioCtx, dest);
    hornTimer = setInterval(function(){ if (ambienceOn && Math.random()>0.5) hornBeep(audioCtx, dest); }, 6000);
  }

  var ambienceBtn = document.getElementById('ambience-btn');
  ambienceBtn.addEventListener('click', function(){
    ambienceOn = !ambienceOn;
    ambienceBtn.classList.toggle('on', ambienceOn);
    ambienceBtn.textContent = ambienceOn ? '◉ Ambience' : '◐ Ambience';
    if (ambienceOn){
      ensureCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      startAmbience();
    } else {
      stopAmbience();
      if (hornTimer) clearInterval(hornTimer);
    }
  });

  /* ============ "RIDING ALONG" COUNT ============
     There is no server behind this page, so this cannot be a real
     visitor headcount — it is a gently fluctuating simulated number
     for atmosphere, the same trick a lot of ambient/nostalgia sites
     use. A genuine live count needs a small backend (e.g. a free
     Supabase or Firebase realtime "presence" channel) that every
     visitor connects to; ask if you want that wired in instead. */
  (function activeCount(){
    var el = document.getElementById('active-count');
    var n = 40 + Math.floor(Math.random() * 90);
    el.textContent = n;
    setInterval(function(){
      var delta = Math.floor(Math.random() * 7) - 3;
      n = Math.max(12, Math.min(260, n + delta));
      el.textContent = n;
    }, 4000 + Math.random() * 3000);
  })();

  /* ============ FILM GRAIN (canvas-generated noise tile, no external image) ============ */
  (function grain(){
    var c = document.createElement('canvas'); c.width = 120; c.height = 120;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(120,120);
    for (var i=0;i<img.data.length;i+=4){
      var v = Math.random()*255;
      img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=30;
    }
    ctx.putImageData(img,0,0);
    document.getElementById('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();

})();
</script>
</body>
</html>
