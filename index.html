<!--
  ============================================================
  ADDING YOUR LICENSED SONGS — fully automatic, no code edits
  ============================================================
  This player is self-hosted (no Spotify, no login, no ads, no
  30-second preview limit) AND it reads its song list live from
  your GitHub repo's "songs" folder every time the page loads,
  and again every few minutes after that. Add or remove an MP3
  in that folder on GitHub and the page picks it up on its own,
  nothing here needs to change.

  ONE-TIME SETUP (do this once, not per song):
  1) Fill in GITHUB_OWNER, GITHUB_REPO and GITHUB_BRANCH just
     below with your GitHub username, repo name, and branch
     (usually "main"). The repo needs to be public — this reads
     it through GitHub's public API, no login/token involved.
  2) Make sure there's a folder named "songs" (SONGS_FOLDER
     below) in that repo, and host this HTML file from the same
     repo, ideally via GitHub Pages.

  FROM THEN ON, adding a song is just: upload an MP3 into the
  songs folder on GitHub. Removing one is just: delete it there.
  The page always reflects whatever is in that folder.

  Display names: files named like "K J Yesudas - Aluva Puzha.mp3"
  (Artist - Title) show up nicely split into artist and title
  automatically. Anything without that " - " pattern just shows
  the file name as the title — still works, just plainer.

  The three round stickers on the cassette deck (YouTube, Spotify,
  Apple Music) are placeholder links — find YOUTUBE_PLAYLIST_URL,
  SPOTIFY_PLAYLIST_URL and APPLE_MUSIC_PLAYLIST_URL further down
  in the <script> block and paste your real playlist URLs in.
  Until then they're just inert stickers, clicking does nothing.
  ============================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;600;700&family=Cormorant+Garamond:wght@500;600&family=Share+Tech+Mono&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --oxblood:#5a1a26;
    --oxblood-deep:#2a0c13;
    --brass:#caa056;
    --brass-dim:#7a5f2c;
    --brass-glow: rgba(202,160,86,0.55);
    --cream:#ecdfc4;
    --ink:#07070a;
    --teal-deep:#0a1a20;
    --teal:#12303a;
    --glass-panel: rgba(10,7,8,0.58);
    --vh: 100vh;
  }

  html{ color-scheme: dark only; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
  body{
    position:relative; height:var(--vh); width:100vw;
    font-family:'Cormorant Garamond', serif;
    color:var(--cream);
  }
  @supports (height: 100dvh){ body{ height:100dvh; } }

  button{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- STAGE ---------- */
  #stage{ position:absolute; inset:0; overflow:hidden; }
  .scene-bg{
    position:absolute; inset:-4%;
    background: linear-gradient(to bottom, var(--teal-deep) 0%, var(--teal) 42%, #241708 74%, #150e05 100%);
    animation: kenburns 40s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes kenburns{ from{ transform:scale(1) translate(0,0);} to{ transform:scale(1.06) translate(-1%,-1%);} }

  .skyline{ position:absolute; left:0; right:0; bottom:40%; height:18%; display:flex; align-items:flex-end; opacity:.5; }
  .skyline i{ flex:none; background:#081014; margin-right:4px; }

  .lamp{ position:absolute; top:4%; width:2px; height:30%; background:linear-gradient(to bottom, rgba(255,210,130,0), #4a3210); }
  .lamp .glow{
    position:absolute; bottom:-38px; left:50%; width:200px; height:200px; margin-left:-100px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,205,120,.48), transparent 65%);
    animation: flicker 5s ease-in-out infinite;
  }
  .lamp.l1{ left:10%; } .lamp.l2{ left:52%; top:1%; } .lamp.l3{ left:86%; top:3%; }
  @keyframes flicker{ 0%,100%{opacity:1;} 46%{opacity:1;} 48%{opacity:.62;} 51%{opacity:1;} 83%{opacity:.82;} }

  .fog-band{ position:absolute; left:-10%; right:-10%; bottom:16%; height:14%; background: linear-gradient(to top, rgba(230,190,130,.16), transparent); filter: blur(6px); }
  .ground-reflect{ position:absolute; left:0; right:0; bottom:0; height:16%; background: linear-gradient(to bottom, rgba(20,10,8,.6), transparent); }

  /* ---------- ROADSIDE COCONUT PALMS ---------- */
  .palms{ position:absolute; left:0; right:0; bottom:12%; height:30%; pointer-events:none; }
  .palm{ position:absolute; bottom:0; width:5px; background:var(--oxblood-deep); transform-origin:bottom center; animation: sway 6s ease-in-out infinite; }
  .palm i{ position:absolute; width:26px; height:8px; background:#1c4a24; border-radius:50% 50% 50% 0; }
  .palm i:nth-child(1){ top:-4px; left:-1px; transform: rotate(-42deg) translateX(-10px); }
  .palm i:nth-child(2){ top:-5px; left:-1px; transform: rotate(-8deg) translateX(2px); }
  .palm i:nth-child(3){ top:-4px; left:-1px; transform: rotate(24deg) translateX(9px); }
  .palm i:nth-child(4){ top:-2px; left:-1px; transform: rotate(52deg) translateX(12px); }
  @keyframes sway{ 0%,100%{ transform: rotate(-2deg); } 50%{ transform: rotate(2deg); } }

  /* ---------- BUS ---------- */
  .bus-wrap{ position:absolute; left:50%; bottom:36%; width:min(72vw, 620px); transform:translateX(-50%); filter: drop-shadow(0 16px 20px rgba(0,0,0,.6)); z-index:3; }
  .bus-wrap svg{ display:block; width:100%; height:auto; }
  .rider{ transform-box: fill-box; transform-origin: 50% 100%; animation: riderSway 3.6s ease-in-out infinite; }
  .rider-2{ animation-duration: 4.1s; animation-delay: -1.4s; }
  @keyframes riderSway{ 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(.8px) rotate(.6deg); } }

  /* ---------- ROADSIDE KIOSKS ---------- */
  .kiosk{ position:absolute; bottom:15%; width:11%; min-width:74px; max-width:120px; z-index:2; }
  .kiosk .roof{ height:10px; border-radius:3px 3px 0 0; box-shadow:0 4px 8px rgba(0,0,0,.5); }
  .kiosk .body{ position:relative; height:64px; border-radius:0 0 5px 5px; overflow:hidden; }
  .kiosk .counter{ position:absolute; left:6%; right:6%; bottom:8%; height:34%; background:rgba(0,0,0,.55); border-radius:2px; }
  .kiosk .sign{
    position:absolute; top:-26px; left:50%; transform:translateX(-50%) rotate(-1.5deg);
    background:#0a0a0a; border:1px solid var(--brass-dim); border-radius:3px;
    padding:3px 7px; font-family:'Share Tech Mono', monospace; font-size:.5rem; letter-spacing:1px;
    color:var(--brass); white-space:nowrap;
  }
  .kiosk .bulb{ position:absolute; top:-4px; left:50%; width:60px; height:60px; margin-left:-30px; border-radius:50%; background:radial-gradient(circle, rgba(255,210,140,.4), transparent 70%); }

  .kiosk.lottery{ left:6%; }
  .kiosk.lottery .roof{ background: repeating-linear-gradient(90deg, #a1273a 0 8px, #ecdfc4 8px 16px); }
  .kiosk.lottery .body{ background: linear-gradient(160deg, #6b4a2c, #3a2a16); }
  .kiosk.lottery .ribbons{ position:absolute; top:8px; left:8%; right:8%; display:flex; justify-content:space-between; }
  .kiosk.lottery .ribbons span{
    display:block; width:6px; height:26px; border-radius:1px; transform-origin:top center;
    animation: ribbonSway 3.4s ease-in-out infinite;
  }
  .kiosk.lottery .ribbons span:nth-child(1){ background:#d9b23a; animation-delay:0s; }
  .kiosk.lottery .ribbons span:nth-child(2){ background:#a1273a; animation-delay:.4s; }
  .kiosk.lottery .ribbons span:nth-child(3){ background:#2e6b3a; animation-delay:.8s; }
  .kiosk.lottery .ribbons span:nth-child(4){ background:#c9762f; animation-delay:1.2s; }
  @keyframes ribbonSway{ 0%,100%{ transform: rotate(-6deg); } 50%{ transform: rotate(6deg); } }

  .kiosk.juice{ left:80%; }
  .kiosk.juice .roof{ background: repeating-linear-gradient(90deg, #2e6b3a 0 8px, #ecdfc4 8px 16px); }
  .kiosk.juice .body{ background: linear-gradient(160deg, #7a5522, #402c10); }
  .kiosk.juice .fruit{ position:absolute; bottom:44%; display:flex; gap:5px; left:10%; }
  .kiosk.juice .fruit i{ width:12px; height:12px; border-radius:50%; display:block; }
  .kiosk.juice .fruit i:nth-child(1){ background:radial-gradient(circle at 35% 35%, #ffb03a, #c9762f); }
  .kiosk.juice .fruit i:nth-child(2){ background:radial-gradient(circle at 35% 35%, #cfe86a, #7a9c2e); }
  .kiosk.juice .fruit i:nth-child(3){ background:radial-gradient(circle at 35% 35%, #ff7a6a, #b8352a); }

  .crowd{ position:absolute; bottom:15%; display:flex; align-items:flex-end; gap:14px; z-index:2; }
  .crowd i{ flex:none; width:9px; height:26px; border-radius:5px 5px 0 0; background:#060a0d; opacity:.85; box-shadow:0 4px 6px rgba(0,0,0,.4); }

  /* ---------- SHARED ATMOSPHERE OVERLAYS ---------- */
  #vignette{ position:absolute; inset:0; pointer-events:none; z-index:5; background: radial-gradient(ellipse 80% 75% at 50% 48%, transparent 40%, rgba(0,0,0,.62) 100%); }
  #grain{ position:absolute; inset:0; pointer-events:none; z-index:6; opacity:.16; mix-blend-mode:overlay; background-repeat:repeat; }
  .letterbox{ position:absolute; left:0; right:0; height:clamp(6px,2vh,16px); background:#000; z-index:8; pointer-events:none; }
  .letterbox.top{ top:0; } .letterbox.bottom{ bottom:0; }
  .particles{ position:absolute; inset:0; overflow:hidden; z-index:4; pointer-events:none; }
  .particles span{ position:absolute; bottom:-6%; width:3px; height:3px; border-radius:50%; background: rgba(255,220,160,.55); opacity:0; animation: floatUp linear infinite; }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(0) translateX(0); } 10%{opacity:.7;} 90%{opacity:.5;} 100%{ opacity:0; transform:translateY(-120vh) translateX(20px); } }

  /* ---------- TOP BAR ---------- */
  #top-bar{ position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding: max(14px, env(safe-area-inset-top)) 16px 0; }
  #title-block{ text-align:center; margin:0 auto; pointer-events:none; }
  #title-ml{ font-family:'Noto Sans Malayalam', sans-serif; font-weight:700; font-size:clamp(1.5rem,5.2vw,2.5rem); margin:0;
    color:var(--brass); text-shadow: 0 0 22px var(--brass-glow), 0 2px 0 rgba(0,0,0,.5); letter-spacing:1px; }
  #title-en{ font-family:'Share Tech Mono', monospace; font-size:clamp(.55rem,1.4vw,.68rem); letter-spacing:4px; opacity:.55; margin:2px 0 0; }
  #title-tagline{
    font-family:'Cormorant Garamond', serif; font-style:italic; font-weight:500;
    font-size:clamp(.7rem,1.6vw,.9rem); color:var(--cream); opacity:.62;
    margin:10px auto 0; max-width:min(80vw,420px); line-height:1.4;
  }

  #top-right-cluster{
    position:absolute; right:16px; top:max(14px, env(safe-area-inset-top)); z-index:21;
    display:flex; gap:8px;
  }
  .top-pill{
    background:var(--glass-panel); border:1px solid rgba(202,160,86,.18); color:var(--cream);
    padding:9px 12px; border-radius:12px; font-weight:600; font-size:clamp(.68rem,1.6vw,.8rem);
    cursor:pointer; backdrop-filter: blur(8px); letter-spacing:.4px;
  }
  .top-pill:active{ transform: translateY(1px); }
  #ambience-btn.on{ color:var(--brass); border-color:rgba(202,160,86,.5); background:rgba(202,160,86,.14); }
  #share-btn.sharing{ opacity:.6; }

  #share-toast{
    position:absolute; top:64px; right:16px; z-index:25; max-width:230px;
    background:var(--glass-panel); border:1px solid rgba(202,160,86,.3); color:var(--cream);
    padding:9px 13px; border-radius:10px; font-size:.72rem; line-height:1.35;
    opacity:0; transform:translateY(-6px); transition:opacity .25s, transform .25s; pointer-events:none;
    backdrop-filter: blur(8px);
  }
  #share-toast.show{ opacity:1; transform:translateY(0); }

  #top-left-cluster{
    position:absolute; left:16px; top:max(14px, env(safe-area-inset-top)); z-index:21;
    display:flex; flex-direction:column; gap:8px; align-items:flex-start;
  }
  #active-badge, #visit-flag{
    background:var(--glass-panel); border:1px solid rgba(202,160,86,.18); color:var(--cream);
    padding:9px 12px; border-radius:12px; font-weight:600; font-size:clamp(.65rem,1.5vw,.78rem);
    backdrop-filter: blur(8px); letter-spacing:.3px;
    display:flex; align-items:center; gap:7px; white-space:nowrap;
  }
  #active-badge .dot{ width:7px; height:7px; border-radius:50%; background:#3ddc74; box-shadow:0 0 6px #3ddc74; flex:none; animation: dotPulse 2s ease-in-out infinite; }
  @keyframes dotPulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }
  #visit-flag .flag-icon{ font-size:.85em; line-height:1; filter: drop-shadow(0 0 4px rgba(202,160,86,.5)); }

  /* ---------- PLAYER: CASSETTE DECK ---------- */
  #dashboard{
    position:absolute; bottom:max(18px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    z-index:30; width:min(92vw, 400px);
    background: linear-gradient(160deg, #7a2436 0%, #5a1a26 45%, #33101a 100%);
    border:2px solid #1c0608; border-radius:16px;
    padding:14px 14px 12px; box-shadow: 0 18px 40px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.08);
    display:flex; flex-direction:column; gap:8px;
  }
  #dashboard::before{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background: repeating-linear-gradient(100deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 6px);
  }
  .screw{ position:absolute; width:7px; height:7px; border-radius:50%; z-index:2;
    background: radial-gradient(circle at 35% 30%, #e6d3a8, #7a5f2c 70%, #33230f);
    box-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .screw.tl{ top:7px; left:8px; } .screw.tr{ top:7px; right:8px; }
  .screw.bl{ bottom:7px; left:8px; } .screw.br{ bottom:7px; right:8px; }

  .tape-stripe{ height:6px; border-radius:2px; background:#e3d0a3; opacity:.85; margin:0 6px; flex:none; }

  /* stickers: YouTube / Spotify / Apple Music placeholders, stuck to the deck */
  .stickers{ position:absolute; top:-13px; right:16px; display:flex; gap:6px; z-index:6; }
  .sticker{
    width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.18); cursor:pointer;
  }
  .sticker.youtube{
    background:#fff; width:38px; height:28px; border-radius:6px; padding:2px;
    transform:rotate(-9deg);
  }
  .sticker.youtube svg{ width:100%; height:100%; display:block; }
  .sticker.spotify{ background:#1DB954; transform:rotate(5deg); }
  .sticker.spotify svg{ width:62%; height:62%; }
  .sticker.apple{
    background: linear-gradient(135deg,#fa233b,#fb5c74); border-radius:9px;
    width:30px; height:30px; transform:rotate(-4deg);
  }
  .sticker.apple svg{ width:60%; height:60%; }

  /* tape window with two spinning reels */
  .tape-window{
    position:relative; height:min(23vw,96px); border-radius:8px; margin-top:14px;
    background: linear-gradient(180deg, #1a0d10, #0a0506);
    border:2px solid #150708; box-shadow: inset 0 4px 10px rgba(0,0,0,.75);
    display:flex; align-items:center; justify-content:space-between; padding:0 18px;
    overflow:hidden;
  }
  .sprockets{ position:absolute; left:0; right:0; display:flex; justify-content:space-between; padding:0 12px; pointer-events:none; }
  .sprockets.top{ top:4px; } .sprockets.bottom{ bottom:4px; }
  .sprockets span{ width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.18); }
  .tape-strand{ position:absolute; top:50%; left:70px; right:70px; height:2px; background:rgba(0,0,0,.75); transform:translateY(-50%); z-index:0; }
  .reel{
    position:relative; z-index:1; width:min(15vw,54px); height:min(15vw,54px); border-radius:50%;
    background: radial-gradient(circle, #caa056 0 12%, #7a5f2c 13% 38%, #150708 39% 100%);
  }
  .reel::before{
    content:''; position:absolute; inset:16%; border-radius:50%;
    background: repeating-conic-gradient(#150708 0deg 12deg, transparent 12deg 60deg);
  }
  .reel::after{ content:''; position:absolute; top:50%; left:50%; width:14%; height:14%; margin:-7% 0 0 -7%; border-radius:50%; background:#0a0506; }
  body.playing .reel{ animation: reelSpin 2.1s linear infinite; }
  @keyframes reelSpin{ to{ transform: rotate(360deg); } }

  /* cassette label — sticker-style, handwritten */
  #np-panel{
    background: var(--cream); border-radius:4px; margin:4px 6px 2px;
    padding:7px 10px 8px; box-shadow: 0 3px 6px rgba(0,0,0,.35), inset 0 0 0 1px rgba(0,0,0,.08);
    transform: rotate(-0.5deg); text-align:center; overflow:hidden;
  }
  #np-index{ font-family:'Share Tech Mono', monospace; font-size:.56rem; letter-spacing:2px; color:#7a5f2c; }
  #np-title{ font-family:'Caveat', cursive; font-weight:700; font-size:clamp(1.25rem,3.6vw,1.55rem); color:#2a1810; line-height:1.05; }
  #np-artist{ font-family:'Caveat', cursive; font-weight:600; font-size:.92rem; color:#5a4022; opacity:.85; }

  #controls-row{ display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .ctrl-btn{
    background: linear-gradient(180deg, #4a342a, #1c1210);
    border:1px solid #0a0506; color:var(--cream); cursor:pointer;
    border-radius:6px; display:flex; align-items:center; justify-content:center;
    transition: transform .12s ease, box-shadow .15s; flex:none;
    box-shadow: 0 3px 0 #0a0506, inset 0 1px 0 rgba(255,255,255,.12);
  }
  .ctrl-btn:hover{ box-shadow: 0 3px 0 #0a0506, 0 0 12px var(--brass-glow); }
  .ctrl-btn:active{ transform: translateY(2px); box-shadow: inset 0 1px 3px rgba(0,0,0,.6); }
  #prev-btn, #next-btn{ width:46px; height:38px; font-size:1rem; }
  #play-btn{ width:70px; height:38px; font-size:1.15rem; background: linear-gradient(180deg, var(--brass), var(--brass-dim)); color:#20140a; border:none; box-shadow: 0 3px 0 #4a3410, inset 0 1px 0 rgba(255,255,255,.3); }
  #shuffle-btn{ width:38px; height:38px; font-size:.85rem; opacity:.8; }
  #shuffle-btn.on{ opacity:1; background: linear-gradient(180deg, var(--brass), var(--brass-dim)); color:#20140a; border-color:transparent; box-shadow: 0 3px 0 #4a3410, inset 0 1px 0 rgba(255,255,255,.3); }

  #meta-row{ display:flex; align-items:center; gap:8px; padding:0 2px; }
  #time-elapsed, #time-duration{ font-family:'Share Tech Mono', monospace; font-size:.64rem; opacity:.8; flex:none; min-width:30px; text-align:center; user-select:none; }
  #progress-track{ flex:1; height:18px; display:flex; align-items:center; cursor:pointer; touch-action:none; }
  #progress-groove{ position:relative; width:100%; height:5px; border-radius:2px; background:#1a0d10; box-shadow: inset 0 1px 3px rgba(0,0,0,.7); overflow:hidden; }
  #progress-fill{ height:100%; width:0%; background: linear-gradient(90deg, var(--brass-dim), var(--brass)); transition:width .2s linear; }
  #progress-knob{ position:absolute; top:50%; left:0%; width:8px; height:14px; margin:-7px 0 0 -4px; border-radius:2px; background:var(--brass); box-shadow:0 0 6px var(--brass-glow); pointer-events:none; }
  #eq{ display:flex; align-items:flex-end; gap:3px; height:16px; flex:none; }
  #eq span{ width:3px; background:#2fae5c; border-radius:1px; height:3px; opacity:.6; }
  body.playing #eq span:nth-child(1){ animation: eqbar .9s ease-in-out infinite; }
  body.playing #eq span:nth-child(2){ animation: eqbar .7s ease-in-out infinite .15s; }
  body.playing #eq span:nth-child(3){ animation: eqbar 1.1s ease-in-out infinite .3s; }

<script>
(function(){
  "use strict";

  /* ============ CONFIG — fill these in once ============ */
  var GITHUB_OWNER  = "sachinnair-dev";
  var GITHUB_REPO   = "aanavandi";
  var GITHUB_BRANCH = "main";
  var SONGS_FOLDER  = "songs";
  var REFRESH_EVERY_MS = 5 * 60 * 1000; // re-check the folder every 5 minutes

  // Paste your real playlist links here whenever you have them — the three
  // sticker icons on the cassette deck open these in a new tab. Leaving them
  // as "#" just makes the sticker inert (a click does nothing) until filled in.
  var YOUTUBE_PLAYLIST_URL     = "https://www.youtube.com/watch?v=1WJiL3H_PF8&list=PLcyLlGTzTiWw";
  var SPOTIFY_PLAYLIST_URL     = "https://open.spotify.com/playlist/0igFSTWSb1Wn6T7O0ZVUvf";
  var APPLE_MUSIC_PLAYLIST_URL = "#";
  document.getElementById('sticker-youtube').href = YOUTUBE_PLAYLIST_URL;
  document.getElementById('sticker-spotify').href = SPOTIFY_PLAYLIST_URL;
  document.getElementById('sticker-apple').href = APPLE_MUSIC_PLAYLIST_URL;

  // Real visit counter (the "🚩 visits" flag, top-left). This uses the free
  // counterapi.dev service so the count survives across everyone's visits
  // with no backend of your own. To turn it on:
  //   1. Go to https://app.counterapi.dev/register and make a free account
  //      (no card needed — 1,000 counts/day on the free tier, plenty for this).
  //   2. Create a workspace, then create a counter inside it (any name, e.g.
  //      "aanavandi-visits"), and copy your API key from the dashboard.
  //   3. Paste the workspace slug, counter name, and API key below.
  // NOTE: because this page has no server, that key lives in plain sight in
  // this file's source — anyone who looks can see it and, in theory, hit
  // your counter with it. That's a real tradeoff of a zero-backend counter,
  // not a bug. Worst case is a wrong number, not real exposure. If that
  // bothers you, leave COUNTERAPI_API_KEY as "" and the flag just won't
  // update from "—".
  var COUNTERAPI_WORKSPACE = "first-counter-5041";
  var COUNTERAPI_COUNTER   = "aanavandi-visits";
  var COUNTERAPI_API_KEY   = "ut_9IZnxcLwFwAktQZqpL5wLyQQUJaU1pRRA7BxtaHQ";

  var body = document.body;
  var player = document.getElementById('player');
  var TRACKS = [];
  var currentIndex = 0;

  function setNowPlayingMessage(title, artist){
    document.getElementById('np-index').textContent = '';
    document.getElementById('np-title').textContent = title;
    document.getElementById('np-artist').textContent = artist || '';
  }

  // "Artist - Title.mp3" (or "01 - Artist - Title.mp3") splits nicely into
  // artist + title. Anything else just shows the file name as the title.
  function parseTrackFromFile(item){
    var base = item.name.replace(/\.(mp3|m4a|ogg|wav)$/i, '');
    base = base.replace(/^\s*\d+[\s\-_.]*/, ''); // drop a leading "01 - " track number if present
    var parts = base.split(/\s-\s/);
    var artist = '', title = base;
    if (parts.length >= 2){ artist = parts[0].trim(); title = parts.slice(1).join(' - ').trim(); }
    return { title: title || item.name, artist: artist, file: item.download_url, _name: item.name };
  }

  function applyNewTrackList(newTracks){
    var playingName = TRACKS[currentIndex] ? TRACKS[currentIndex]._name : null;
    var firstLoad = (TRACKS.length === 0 && !player.src);
    TRACKS = newTracks;
    if (TRACKS.length === 0){ setNowPlayingMessage('No songs yet', 'drop MP3 files into the songs folder on GitHub'); return; }
    var matchIdx = playingName ? TRACKS.findIndex(function(t){ return t._name === playingName; }) : -1;
    if (matchIdx >= 0){
      currentIndex = matchIdx;
      document.getElementById('np-index').textContent = 'TRACK ' + (currentIndex+1) + ' OF ' + TRACKS.length;
    } else {
      loadTrack(0, false);
    }
    if (firstLoad) loadTrack(0, false);
  }

  function fetchTrackList(showLoading){
    if (showLoading) setNowPlayingMessage('Loading songs…', '');
    var api = 'https://api.github.com/repos/' + GITHUB_OWNER + '/' + GITHUB_REPO + '/contents/' + SONGS_FOLDER + '?ref=' + GITHUB_BRANCH;
    fetch(api, { cache: 'no-store' })
      .then(function(res){ if (!res.ok) throw new Error('GitHub API responded ' + res.status); return res.json(); })
      .then(function(data){
        var files = data.filter(function(item){ return item.type === 'file' && /\.(mp3|m4a|ogg|wav)$/i.test(item.name); });
        files.sort(function(a,b){ return a.name.localeCompare(b.name, undefined, { numeric:true }); });
        applyNewTrackList(files.map(parseTrackFromFile));
      })
      .catch(function(err){
        console.warn('Could not load the song list from GitHub:', err);
        if (TRACKS.length === 0){ setNowPlayingMessage("Couldn't load the song list", 'check GITHUB_OWNER / GITHUB_REPO at the top of the script'); }
      });
  }

  /* ============ FIX MOBILE VIEWPORT HEIGHT (address bar resize) ============ */
  function setVh(){ document.documentElement.style.setProperty('--vh', window.innerHeight + 'px'); }
  setVh(); window.addEventListener('resize', setVh); window.addEventListener('orientationchange', setVh);

  /* ============ SKYLINE (generated) ============ */
  var skyline = document.getElementById('skyline');
  for (var s=0; s<22; s++){
    var b = document.createElement('i');
    var w = 18 + Math.random()*26;
    var h = 20 + Math.random()*75;
    b.style.width = w + 'px'; b.style.height = h + '%';
    skyline.appendChild(b);
  }

  /* ============ COCONUT PALMS (generated, scattered roadside) ============ */
  var palmHost = document.getElementById('palms');
  var palmSpots = [3,9,17,24,68,76,84,92];
  palmSpots.forEach(function(pct, idx){
    var p = document.createElement('div');
    p.className = 'palm';
    var h = 70 + Math.random()*40;
    p.style.left = pct + '%';
    p.style.height = h + 'px';
    p.style.animationDelay = (idx*0.4) + 's';
    p.innerHTML = '<i></i><i></i><i></i><i></i>';
    palmHost.appendChild(p);
  });

  /* ============ PARTICLES ============ */
  document.querySelectorAll('.particles').forEach(function(container){
    var count = 18;
    for (var p=0; p<count; p++){
      var sp = document.createElement('span');
      sp.style.left = (Math.random()*100)+'%';
      var dur = 7 + Math.random()*11;
      sp.style.animationDuration = dur+'s';
      sp.style.animationDelay = (Math.random()*dur)+'s';
      sp.style.opacity = (0.2 + Math.random()*0.4);
      container.appendChild(sp);
    }
  });

  /* ============ SELF-HOSTED PLAYBACK (plain <audio>, full songs, no login, no ads) ============ */
  var isScrubbing = false;

  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec || 0));
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function loadTrack(index, autoplay){
    if (TRACKS.length === 0) return;
    currentIndex = ((index % TRACKS.length) + TRACKS.length) % TRACKS.length;
    var t = TRACKS[currentIndex];
    player.src = t.file;
    document.getElementById('np-index').textContent = 'TRACK ' + (currentIndex+1) + ' OF ' + TRACKS.length;
    document.getElementById('np-title').textContent = t.title;
    document.getElementById('np-artist').textContent = t.artist;
    document.getElementById('progress-fill').style.width = '0%';
    document.getElementById('progress-knob').style.left = '0%';
    document.getElementById('time-elapsed').textContent = '0:00';
    document.getElementById('time-duration').textContent = '0:00';
    if (autoplay){ player.play().catch(function(){ /* needs a user gesture first — fine, they just tapped play */ }); }
  }

  function playPause(){
    if (TRACKS.length === 0) return;
    if (player.paused){ player.play().catch(function(err){ console.warn('Could not play — check that', TRACKS[currentIndex].file, 'is reachable.', err); }); }
    else { player.pause(); }
  }

  var shuffleOn = false;
  var shuffleHistory = []; // stack of indices visited in shuffle mode, so "previous" can back out of it
  function pickRandomIndex(){
    if (TRACKS.length <= 1) return currentIndex;
    var idx;
    do { idx = Math.floor(Math.random() * TRACKS.length); } while (idx === currentIndex);
    return idx;
  }

  // Shared by the Next button and the natural end-of-song advance below.
  // forcePlay=true is used specifically for "song finished on its own" —
  // by the time the 'ended' event fires the browser has already flipped
  // player.paused to true as part of ending playback, so checking paused
  // here would always read as "was paused" and silently stop the playlist
  // after every single track. Passing true instead keeps it continuous.
  function advanceTrack(forcePlay){
    if (TRACKS.length === 0) return;
    var play = forcePlay || !player.paused;
    if (shuffleOn){
      shuffleHistory.push(currentIndex);
      loadTrack(pickRandomIndex(), play);
    } else {
      loadTrack(currentIndex+1, play);
    }
  }
  function nextTrack(){ advanceTrack(false); }
  function prevTrack(){
    if (TRACKS.length === 0) return;
    var wasPlaying = !player.paused;
    if (shuffleOn && shuffleHistory.length){
      loadTrack(shuffleHistory.pop(), wasPlaying);
    } else {
      loadTrack(currentIndex-1, wasPlaying);
    }
  }

  var shuffleBtn = document.getElementById('shuffle-btn');
  shuffleBtn.addEventListener('click', function(){
    shuffleOn = !shuffleOn;
    shuffleHistory = [];
    shuffleBtn.classList.toggle('on', shuffleOn);
  });

  player.addEventListener('play', function(){ body.classList.add('playing'); document.getElementById('play-btn').textContent = '⏸'; });
  player.addEventListener('pause', function(){ body.classList.remove('playing'); document.getElementById('play-btn').textContent = '▶'; });
  player.addEventListener('ended', function(){ advanceTrack(true); });
  player.addEventListener('error', function(){
    if (TRACKS.length === 0) return;
    document.getElementById('np-title').textContent = TRACKS[currentIndex].title + ' — file not reachable';
    document.getElementById('np-artist').textContent = 'check the songs folder on GitHub';
  });
  player.addEventListener('timeupdate', function(){
    if (isScrubbing || !player.duration) return;
    var pct = Math.min(100, (player.currentTime / player.duration) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-knob').style.left = pct + '%';
    document.getElementById('time-elapsed').textContent = fmtTime(player.currentTime);
    document.getElementById('time-duration').textContent = fmtTime(player.duration);
  });
  player.addEventListener('loadedmetadata', function(){
    document.getElementById('time-duration').textContent = fmtTime(player.duration);
  });

  /* ============ pick up the folder now, and keep checking ============ */
  setNowPlayingMessage('Loading songs…', '');
  fetchTrackList(true);
  setInterval(function(){ fetchTrackList(false); }, REFRESH_EVERY_MS);

  /* ============ SEEK (drag or tap the progress bar) ============ */
  (function setupSeek(){
    var track = document.getElementById('progress-track');
    var fill = document.getElementById('progress-fill');
    var knob = document.getElementById('progress-knob');
    var elapsedLabel = document.getElementById('time-elapsed');

    function pctFromEvent(e){
      var rect = track.getBoundingClientRect();
      var x = (e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX));
      return Math.min(1, Math.max(0, (x - rect.left) / rect.width));
    }
    function preview(pct){
      fill.style.width = (pct*100) + '%';
      knob.style.left = (pct*100) + '%';
      if (player.duration) elapsedLabel.textContent = fmtTime(pct * player.duration);
    }
    track.addEventListener('pointerdown', function(e){
      if (!player.duration) return;
      isScrubbing = true;
      track.setPointerCapture(e.pointerId);
      preview(pctFromEvent(e));
    });
    track.addEventListener('pointermove', function(e){
      if (!isScrubbing) return;
      preview(pctFromEvent(e));
    });
    track.addEventListener('pointerup', function(e){
      if (!isScrubbing) return;
      var pct = pctFromEvent(e);
      preview(pct);
      isScrubbing = false;
      if (player.duration) player.currentTime = pct * player.duration;
    });
    track.addEventListener('pointercancel', function(){ isScrubbing = false; });
  })();

  document.getElementById('play-btn').addEventListener('click', playPause);
  document.getElementById('next-btn').addEventListener('click', nextTrack);
  document.getElementById('prev-btn').addEventListener('click', prevTrack);

  /* ============ AMBIENT SOUND (Web Audio API, synthesized, no external files) ============ */
  var audioCtx = null;
  var ambienceOn = false;
  var activeNodes = [];

  function ensureCtx(){ if (!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } return audioCtx; }
  function stopAmbience(){ activeNodes.forEach(function(n){ try{ n.stop(); }catch(e){} try{ n.disconnect(); }catch(e){} }); activeNodes = []; }

  function engineIdle(ctx, dest){
    var osc = ctx.createOscillator(); osc.type='sawtooth'; osc.frequency.value = 42;
    var gain = ctx.createGain(); gain.gain.value = 0.03;
    var lfo = ctx.createOscillator(); lfo.frequency.value = 3.2; var lfoGain = ctx.createGain(); lfoGain.gain.value = 4;
    lfo.connect(lfoGain); lfoGain.connect(osc.frequency);
    osc.connect(gain); gain.connect(dest);
    osc.start(); lfo.start();
    activeNodes.push(osc, lfo);
  }
  function crowdMurmur(ctx, dest){
    var bufferSize = 2 * ctx.sampleRate;
    var buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * 0.5; }
    var noise = ctx.createBufferSource(); noise.buffer = buffer; noise.loop = true;
    var filter = ctx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value = 850;
    var gain = ctx.createGain(); gain.gain.value = 0.04;
    noise.connect(filter); filter.connect(gain); gain.connect(dest);
    noise.start();
    activeNodes.push(noise);
  }
  function hornBeep(ctx, dest){
    var osc = ctx.createOscillator(); osc.type='square'; osc.frequency.value = 340;
    var gain = ctx.createGain(); gain.gain.value = 0.0001;
    osc.connect(gain); gain.connect(dest);
    var t = ctx.currentTime;
    gain.gain.exponentialRampToValueAtTime(0.05, t+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+0.35);
    osc.start(t); osc.stop(t+0.4);
  }

  var hornTimer = null;
  function startAmbience(){
    if (!audioCtx) return;
    stopAmbience();
    var dest = audioCtx.destination;
    engineIdle(audioCtx, dest);
    crowdMurmur(audioCtx, dest);
    hornTimer = setInterval(function(){ if (ambienceOn && Math.random()>0.5) hornBeep(audioCtx, dest); }, 6000);
  }

  var ambienceBtn = document.getElementById('ambience-btn');
  ambienceBtn.addEventListener('click', function(){
    ambienceOn = !ambienceOn;
    ambienceBtn.classList.toggle('on', ambienceOn);
    ambienceBtn.textContent = ambienceOn ? '◉ Ambience' : '◐ Ambience';
    if (ambienceOn){
      ensureCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      startAmbience();
    } else {
      stopAmbience();
      if (hornTimer) clearInterval(hornTimer);
    }
  });

  /* ============ SHARE TO INSTAGRAM STORY (and anywhere else) ============
     No website can force-open Instagram's Stories composer directly —
     that hook only exists for native apps with special entitlements.
     What actually works, and is what this does: build a nice vertical
     (story-shaped) image on the fly, then hand it to the phone's own
     share sheet via the Web Share API. On most modern phones Instagram
     (and its "Add to Story" action) shows up right there as one of the
     share targets, one tap away. If the browser doesn't support sharing
     files (older browsers, most desktops), it just downloads the image
     instead so it can be added to a story manually from the gallery. */
  function roundRectPath(ctx,x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  // Centers a block of text, wrapping onto multiple lines to fit maxWidth.
  function wrapCenteredText(ctx, text, x, y, maxWidth, lineHeight){
    var words = text.split(' ');
    var lines = [], current = '';
    for (var i = 0; i < words.length; i++){
      var test = current ? current + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxWidth && current){
        lines.push(current);
        current = words[i];
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    var startY = y - ((lines.length - 1) * lineHeight) / 2;
    lines.forEach(function(line, idx){ ctx.fillText(line, x, startY + idx * lineHeight); });
  }

  function generateStoryImage(){
    return document.fonts.ready.then(function(){
      var canvas = document.getElementById('share-canvas');
      var W = canvas.width, H = canvas.height;
      var ctx = canvas.getContext('2d');

      var bg = ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,'#0a1a20'); bg.addColorStop(0.45,'#12303a'); bg.addColorStop(0.78,'#241708'); bg.addColorStop(1,'#150e05');
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

      var glow = ctx.createRadialGradient(W/2,H*0.42,80,W/2,H*0.42,W*0.8);
      glow.addColorStop(0,'rgba(255,205,120,0.22)'); glow.addColorStop(1,'rgba(255,205,120,0)');
      ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(202,160,86,0.55)'; ctx.shadowBlur = 30;
      ctx.fillStyle = '#caa056';
      ctx.font = "700 " + Math.round(W*0.12) + "px 'Noto Sans Malayalam'";
      ctx.fillText('ആനവണ്ടി', W/2, H*0.22);
      ctx.shadowBlur = 0;

      ctx.font = "400 " + Math.round(W*0.032) + "px 'Share Tech Mono'";
      ctx.fillStyle = 'rgba(236,223,196,0.7)';
      ctx.fillText('A A N A V A N D I', W/2, H*0.25);

      // little cassette deck graphic
      var cx = W/2, cy = H*0.47, dw = W*0.52, dh = H*0.19;
      var bodyGrad = ctx.createLinearGradient(cx-dw/2, cy-dh/2, cx-dw/2, cy+dh/2);
      bodyGrad.addColorStop(0,'#7a2436'); bodyGrad.addColorStop(1,'#33101a');
      roundRectPath(ctx, cx-dw/2, cy-dh/2, dw, dh, dh*0.14);
      ctx.fillStyle = bodyGrad; ctx.fill();
      ctx.strokeStyle = '#1c0608'; ctx.lineWidth = 6; ctx.stroke();

      var winW = dw*0.82, winH = dh*0.5;
      roundRectPath(ctx, cx-winW/2, cy-winH/2-dh*0.06, winW, winH, winH*0.18);
      ctx.fillStyle = '#0a0506'; ctx.fill();

      var reelR = winH*0.34, reelInset = winW*0.16;
      [cx-winW/2+reelInset, cx+winW/2-reelInset].forEach(function(rx){
        ctx.beginPath(); ctx.fillStyle = '#caa056'; ctx.arc(rx, cy-dh*0.06, reelR, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.fillStyle = '#0a0506'; ctx.arc(rx, cy-dh*0.06, reelR*0.32, 0, Math.PI*2); ctx.fill();
      });

      ctx.fillStyle = '#e3d0a3';
      ctx.fillRect(cx-dw/2+dw*0.04, cy+dh/2-dh*0.12, dw*0.92, dh*0.06);

      var track = (typeof TRACKS !== 'undefined' && TRACKS[currentIndex]) ? TRACKS[currentIndex] : null;
      ctx.font = "600 " + Math.round(W*0.052) + "px 'Cormorant Garamond'";
      ctx.fillStyle = '#ecdfc4';
      ctx.fillText(track ? track.title : 'a bus stand cassette radio', W/2, H*0.64);
      if (track && track.artist){
        ctx.font = "400 " + Math.round(W*0.03) + "px 'Share Tech Mono'";
        ctx.fillStyle = 'rgba(236,223,196,0.65)';
        ctx.fillText(track.artist, W/2, H*0.665);
      }

      ctx.font = "italic 500 " + Math.round(W*0.036) + "px 'Cormorant Garamond'";
      ctx.fillStyle = 'rgba(236,223,196,0.6)';
      wrapCenteredText(ctx, 'some songs only make sense with your forehead against a bus window.', W/2, H*0.79, W*0.72, W*0.05);

      ctx.font = "400 " + Math.round(W*0.03) + "px 'Share Tech Mono'";
      ctx.fillStyle = 'rgba(202,160,86,0.85)';
      ctx.fillText('aanavandi.wtf', W/2, H*0.93);

      return new Promise(function(resolve){ canvas.toBlob(resolve, 'image/png'); });
    });
  }

  function downloadBlob(blob, filename){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 300);
  }

  var shareBtn = document.getElementById('share-btn');
  var shareToast = document.getElementById('share-toast');
  var toastTimer = null;
  function showToast(msg, ms){
    shareToast.textContent = msg;
    shareToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ shareToast.classList.remove('show'); }, ms || 3200);
  }

  // The OS-level "share to Instagram/WhatsApp/etc" sheet only exists on
  // phones — desktop browsers/OSes have no equivalent, so on a computer
  // this button can only ever download the image. This is a rough guess
  // (touch support + narrow viewport), just used to pick the right toast.
  function isLikelyMobile(){
    return (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) && window.innerWidth < 900;
  }

  shareBtn.addEventListener('click', function(){
    shareBtn.classList.add('sharing');
    generateStoryImage().then(function(blob){
      var pageUrl = window.location.href;
      // The link is folded into the caption text itself (not just the
      // separate `url` field) because that's the one thing almost every
      // share target actually displays somewhere — Instagram DM, WhatsApp,
      // Messages, Twitter/X, email all show the text caption. Instagram's
      // own "Add to Story" composer specifically is the one exception: it
      // only takes the image itself and has no way to show an inbound
      // caption/link, that's an Instagram limitation no website can get
      // around. Sharing anywhere else from the same sheet keeps the link.
      var caption = 'Riding along on ആനവണ്ടി 🚌🎵 — ' + pageUrl;
      var file = null, canShareFiles = false;
      if (window.File && navigator.canShare){
        try{ file = new File([blob], 'aanavandi.png', { type:'image/png' }); canShareFiles = navigator.canShare({ files:[file] }); }catch(e){}
      }
      if (canShareFiles && navigator.share){
        return navigator.share({ files:[file], title:'ആനവണ്ടി', text:caption, url:pageUrl }).catch(function(err){
          // Some browsers reject files+url together as a "hostile share" —
          // fall back to files+text only, the link is still in the caption.
          if (err && err.name === 'TypeError'){ return navigator.share({ files:[file], title:'ആനവണ്ടി', text:caption }); }
          throw err;
        });
      } else if (navigator.share){
        return navigator.share({ title:'ആനവണ്ടി', text:caption, url:pageUrl });
      } else {
        downloadBlob(blob, 'aanavandi.png');
        if (isLikelyMobile()){
          showToast('Image saved — open Instagram and add it to your story from your gallery.', 4500);
        } else {
          showToast('Sharing to Instagram only works from a phone browser — this is a computer, so the image just downloaded instead. Open this page on your phone to get the real Share option.', 5500);
        }
      }
    }).catch(function(err){
      if (err && err.name === 'AbortError') return;
      console.warn('Share failed:', err);
      showToast("Couldn't share automatically — try a screenshot instead.");
    }).then(function(){
      shareBtn.classList.remove('sharing');
    });
  });

  /* ============ "RIDING ALONG" COUNT ============
     There is no server behind this page, so this cannot be a real
     visitor headcount — it is a gently fluctuating simulated number
     for atmosphere, the same trick a lot of ambient/nostalgia sites
     use. A genuine live count needs a small backend (e.g. a free
     Supabase or Firebase realtime "presence" channel) that every
     visitor connects to; ask if you want that wired in instead. */
  (function activeCount(){
    var el = document.getElementById('active-count');
    var n = 40 + Math.floor(Math.random() * 90);
    el.textContent = n;
    setInterval(function(){
      var delta = Math.floor(Math.random() * 7) - 3;
      n = Math.max(12, Math.min(260, n + delta));
      el.textContent = n;
    }, 4000 + Math.random() * 3000);
  })();

  /* ============ REAL VISIT COUNTER (🚩 flag, top-left) ============
     Unlike the "riding along" number above, this one is real — it calls
     counterapi.dev to add one to a persistent count every time this page
     loads, then shows the total. See the COUNTERAPI_* config near the top
     of this script for setup. Fails silently (flag just stays "—") if the
     workspace/key haven't been filled in, or if the request fails for any
     reason — a broken counter should never be able to break the page. */
  (function visitCounter(){
    var el = document.getElementById('visit-count');
    if (!COUNTERAPI_WORKSPACE || !COUNTERAPI_API_KEY){ return; }
    var url = 'https://api.counterapi.dev/v2/' + encodeURIComponent(COUNTERAPI_WORKSPACE) +
      '/' + encodeURIComponent(COUNTERAPI_COUNTER) + '/up';
    fetch(url, { headers: { 'Authorization': 'Bearer ' + COUNTERAPI_API_KEY } })
      .then(function(res){ return res.json(); })
      .then(function(json){
        var data = json && json.data ? json.data : json;
        var count = data && (data.up_count != null ? data.up_count : (data.count != null ? data.count : data.value));
        if (typeof count === 'number'){ el.textContent = count.toLocaleString(); }
      })
      .catch(function(err){ console.warn('Visit counter unavailable:', err); });
  })();

  /* ============ FILM GRAIN (canvas-generated noise tile, no external image) ============ */
  (function grain(){
    var c = document.createElement('canvas'); c.width = 120; c.height = 120;
    var ctx = c.getContext('2d');
    var img = ctx.createImageData(120,120);
    for (var i=0;i<img.data.length;i+=4){
      var v = Math.random()*255;
      img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=30;
    }
    ctx.putImageData(img,0,0);
    document.getElementById('grain').style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();

})();
</script>
